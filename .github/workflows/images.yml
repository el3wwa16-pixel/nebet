name: fetch-images
on:
  push:
    branches: [img-tools]
    paths: ['tools/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A candidates images
          git commit -m "images update [skip ci]" || echo nothing
          git push
